<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monatsausgaben</title>
  <meta name="description" content="Wiederkehrende Ausgaben und Einnahmen im Blick, lokal auf dem iPhone.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ausgaben">
  <meta name="theme-color" content="#EDF1F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1719" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <button class="tab" data-tab="overview" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
      <span>Übersicht</span>
    </button>
    <button class="tab" data-tab="entries" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="1.4"/><circle cx="5" cy="12" r="1.4"/><circle cx="5" cy="18" r="1.4"/><path d="M10 6h11M10 12h11M10 18h11"/></svg>
      <span>Einträge</span>
    </button>
    <button class="tab" data-tab="settings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      <span>Einstellungen</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
